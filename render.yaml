# Blueprint: https://render.com/deploy?repo=https://github.com/leaflock420-weedman/leaflock-retail-wholesale
services:
  - type: web
    name: leaflock-retail-wholesale
    runtime: node
    plan: free
    repo: https://github.com/leaflock420-weedman/leaflock-retail-wholesale
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: retail-wholesale-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Australia/Brisbane
      - key: ANALYTICS_ADMIN_PASSWORD
        sync: false
      - key: PORTAL_SESSION_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ANALYTICS_EMAIL_TO
        value: info@leaflock.com.au
      - key: ANALYTICS_EMAIL_FROM
        value: info@leaflock.com.au
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PORTAL_CODE_SALT
        sync: false
      - key: SEED_ACCESS_CODE
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: SITE_URL
        value: https://leaflock-retail-wholesale.onrender.com
      - key: WHOLESALE_EMAIL_TO
        value: info@leaflock.com.au