# Blueprint: https://render.com/deploy?repo=https://github.com/leaflock420-weedman/leaflock-retail-wholesale
services:
  - type: web
    name: leaflock-retail-wholesale
    runtime: node
    plan: free
    repo: https://github.com/leaflock420-weedman/leaflock-retail-wholesale
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Australia/Brisbane
      - key: ANALYTICS_ADMIN_PASSWORD
        sync: false
      - key: PORTAL_SESSION_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ANALYTICS_EMAIL_TO
        value: info+retail@leaflock.com.au
      - key: ANALYTICS_EMAIL_FROM
        value: info@leaflock.com.au
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PORTAL_CODE_SALT
        sync: false
      - key: SEED_ACCESS_CODE
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: SITE_URL
        value: https://www.wholesale.leaflock.com.au
      - key: WHOLESALE_EMAIL_TO
        value: info+retail@leaflock.com.au
      - key: AUSPOST_PAC_API_KEY
        sync: false
      - key: AUSPOST_FROM_POSTCODE
        value: "4217"
      - key: GUMMY_CHECKOUT_ACCESS_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REMOTE_DATA_PREFIX
        value: leaflock:retail-wholesale:v1
