<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Portal Password — LeafLock™ Wholesale</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-nav="portal">
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <p class="eyebrow">Account security</p>
        <h1>Set your password</h1>
        <p class="page-lead" id="setPasswordLead">Create a private password for your wholesale portal. Do not share it with other stores or staff outside your business.</p>
      </section>
      <section class="section">
        <form id="setPasswordForm" class="order-form portal-card" novalidate>
          <p id="setPasswordAccount" class="pending-note" hidden></p>
          <label><span>New password</span><input type="password" id="newPassword" required minlength="10" autocomplete="new-password"></label>
          <label><span>Confirm password</span><input type="password" id="confirmPassword" required minlength="10" autocomplete="new-password"></label>
          <p id="setPasswordError" class="form-error" hidden></p>
          <button class="button primary full-width" type="submit">Save password</button>
          <p>Already set up? <a href="portal.html">Sign in to the portal</a></p>
        </form>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="assets/config.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/set-password.js"></script>
  </body>
</html>
