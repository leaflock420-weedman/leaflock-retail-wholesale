<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create New Password — LeafLock™ Wholesale</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/styles.css?v=20260706m">
  </head>
  <body data-nav="portal">
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <p class="eyebrow">Password reset</p>
        <h1>Create your new password</h1>
        <p class="page-lead" id="setPasswordLead">Choose a new password for your wholesale portal (at least 10 characters).</p>
      </section>
      <section class="section">
        <form id="setPasswordForm" class="order-form portal-card" novalidate>
          <p id="setPasswordAccount" class="pending-note" hidden></p>
          <p id="setPasswordNoToken" class="pending-note" hidden>
            This reset link is missing or expired.
            <a href="forgot-password.html">Request a new reset link</a> or <a href="portal.html">sign in</a>.
          </p>
          <label><span>New password</span><input type="password" id="newPassword" required minlength="10" autocomplete="new-password"></label>
          <label><span>Confirm password</span><input type="password" id="confirmPassword" required minlength="10" autocomplete="new-password"></label>
          <p id="setPasswordError" class="form-error" hidden></p>
          <button class="button primary full-width" type="submit" id="setPasswordSubmit">Save password</button>
          <p><a href="portal.html">Back to sign in</a></p>
        </form>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="assets/config.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/set-password.js?v=20260706i"></script>
  </body>
</html>
