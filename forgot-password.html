<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password — LeafLock™ Wholesale</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/styles.css?v=20260706m">
  </head>
  <body data-nav="portal">
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <p class="eyebrow">Password reset</p>
        <h1>Forgot your password?</h1>
        <p class="page-lead">Enter your wholesale account email. We will email you a private reset link. Click it, choose a new password, then sign in.</p>
      </section>
      <section class="section">
        <form id="forgotPasswordForm" class="order-form portal-card" novalidate>
          <label><span>Email address</span><input type="email" id="forgotEmail" required autocomplete="email"></label>
          <p id="forgotPasswordMessage" class="pending-note" hidden></p>
          <p id="forgotPasswordError" class="form-error" hidden></p>
          <button class="button primary full-width" type="submit">Send reset link</button>
          <p><a href="portal.html">Back to sign in</a></p>
        </form>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="assets/config.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/forgot-password.js?v=20260706j"></script>
  </body>
</html>
